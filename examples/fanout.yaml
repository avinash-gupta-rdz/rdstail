# Fanout config: every record goes to S3 (archive) and Kafka (realtime), and
# ONLY error-and-worse records hit the alert webhook — per-sink `filter`
# narrows what each sink receives. This is how you wire "page me on FATAL"
# without rdstail becoming an alerting system: the webhook feeds your
# SIEM/Slack/PagerDuty bridge, which owns the alerting.
sources:
  - type: rds
    engine: postgres
    region: ap-south-1
    instances: [prod-pg-writer]

  - type: rds
    engine: mysql
    region: ap-south-1
    instances: [prod-mysql-1]

sinks:
  - name: s3-cold
    type: s3
    s3:
      bucket: company-rds-logs
      region: ap-south-1
      prefix: rds/

  - name: kafka-hot
    type: kafka
    kafka:
      brokers: [kafka-1.internal:9092]
      topic_template: rds-logs-{engine}

  - name: alerts
    type: http
    filter:
      min_severity: ERROR      # ERROR, FATAL, PANIC only
    http:
      url: https://hooks.internal/rds-alerts
      gzip: true

state:
  type: sqlite
  path: /var/lib/rdstail/state.db

runtime:
  poll_interval: 10s
  max_workers: 6
  max_instances_concurrent: 2
  shutdown_timeout: 30s
  start_from: end

metrics:
  enabled: true
  listen: :9090
