version: 2

project_name: rdstail

before:
  hooks:
    - go mod tidy

builds:
  - id: rdstail
    main: ./cmd/rdstail
    binary: rdstail
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/avinash-gupta-rdz/rdstail/internal/cli.version={{.Version}}
      - -X github.com/avinash-gupta-rdz/rdstail/internal/cli.commit={{.Commit}}
      - -X github.com/avinash-gupta-rdz/rdstail/internal/cli.buildDate={{.Date}}
    goos:   [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*
      - docs/**/*
      - examples/**/*

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

dockers_v2:
  - id: rdstail
    dockerfile: deploy/Dockerfile.goreleaser
    images:
      - "ghcr.io/avinash-gupta-rdz/rdstail"
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}v{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: rdstail
      org.opencontainers.image.description: "Ship AWS RDS logs to S3, Kafka, or HTTP without CloudWatch."
      org.opencontainers.image.source: "https://github.com/avinash-gupta-rdz/rdstail"
      org.opencontainers.image.licenses: Apache-2.0
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"

homebrew_casks:
  - name: rdstail
    repository:
      owner: avinash-gupta-rdz
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/avinash-gupta-rdz/rdstail"
    description: "Ship AWS RDS logs to S3, Kafka, or HTTP without CloudWatch"
    license: Apache-2.0
    commit_author:
      name: rdstail-release-bot
      email: noreply@github.com
    commit_msg_template: "rdstail {{ .Tag }}"
    # The binaries are not notarized; strip the quarantine flag so macOS
    # Gatekeeper doesn't block the first run.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/rdstail"]
          end

release:
  # Tags like v1.0.0-rc.1 are published as GitHub pre-releases.
  prerelease: auto
