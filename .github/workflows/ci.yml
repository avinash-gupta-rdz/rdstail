name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build, vet, test (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: make build

      - name: Vet
        run: make vet

      - name: Test (race detector)
        run: make test

      - name: Validate example configs
        run: |
          for f in examples/*.yaml; do
            echo "== $f"
            ./bin/rdstail validate -c "$f"
          done

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          # Lint findings shouldn't block while the project is in beta; the
          # race-enabled test job is the merge gate.
          args: --timeout=5m
        continue-on-error: true
